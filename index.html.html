<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>클래식 리듬 마스터 (Classic Rhythm Master)</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tone.js 로드 (웹 오디오 합성 및 클래식 연주용) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <!-- Google Fonts: 우아한 클래식 느낌의 세리프 및 산세리프 폰트 -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        /* 커스텀 스타일 및 애니메이션 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: radial-gradient(circle at center, #1a1625 0%, #0b0910 100%);
            color: #f3e8ff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-classic {
            font-family: 'Cinzel', serif;
        }

        /* 황금빛 테두리 및 네온 효과 */
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }

        .gold-text {
            background: linear-gradient(to bottom, #fde68a, #d97706);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* 절대 못 깨는 난이도 전용 글리치/지옥 효과 */
        .impossible-glow {
            animation: pulseRed 1.5s infinite alternate;
        }

        @keyframes pulseRed {
            from { box-shadow: 0 0 10px #dc2626, inset 0 0 5px #dc2626; }
            to { box-shadow: 0 0 25px #ef4444, inset 0 0 15px #ef4444; }
        }

        /* 버튼 호버 및 클릭 애니메이션 */
        .btn-classic {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-classic:hover {
            transform: translateY(-2px);
            filter: brightness(1.15);
        }
        .btn-classic:active {
            transform: translateY(1px) scale(0.98);
        }

        /* 캔버스 컨테이너 반응형 유지 */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            margin: 0 auto;
            background: linear-gradient(180deg, rgba(15, 12, 24, 0.9) 0%, rgba(28, 22, 44, 0.95) 100%);
            border-left: 2px solid rgba(212, 175, 55, 0.3);
            border-right: 2px solid rgba(212, 175, 55, 0.3);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- 메인 게임 컨테이너 -->
    <div id="game-container" class="shadow-2xl flex flex-col justify-between">
        
        <!-- 1. 시작 및 난이도 선택 화면 (오버레이) -->
        <div id="menu-screen" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-black/85 backdrop-blur-md transition-opacity duration-300">
            <div class="text-center mb-6">
                <p class="text-amber-400/90 text-xs tracking-[0.25em] uppercase mb-1 font-classic font-bold">PRODUCED BY 박민재</p>
                <h1 class="text-3xl sm:text-4xl font-black gold-text tracking-tight mb-1.5">박민재의 클래식 리듬 마스터</h1>
                <p class="text-gray-400 text-xs sm:text-sm">키보드 <span class="text-amber-300 font-bold">[D] [F] [J] [K]</span> 또는 화면 하단 터치</p>
            </div>

            <!-- 곡 선택 박스 -->
            <div class="w-full max-w-sm mb-5 bg-white/5 p-3 rounded-xl gold-border">
                <label class="block text-xs text-amber-300/80 mb-1.5 font-semibold">🎼 연주곡 선택 (클래식 & 명곡 10선)</label>
                <select id="song-select" class="w-full bg-gray-900 text-amber-100 text-sm rounded-lg p-2.5 border border-amber-500/30 focus:outline-none focus:border-amber-400">
                    <option value="summer">☀️ 히사이시 조 - Summer (기쿠지로의 여름 OST)</option>
                    <option value="turkish">모차르트 - 터키 행진곡 (Turkish March)</option>
                    <option value="beethoven">베토벤 - 엘리제를 위하여 (Für Elise)</option>
                    <option value="canon">파헬벨 - 캐논 변주곡 (Canon in D)</option>
                    <option value="spring">비발디 - 사계 '봄' (The Four Seasons: Spring)</option>
                    <option value="fate">베토벤 - 운명 교향곡 5번 (Symphony No. 5)</option>
                    <option value="nocturne">쇼팽 - 녹턴 Op.9 No.2 (Nocturne)</option>
                    <option value="swan">차이코프스키 - 백조의 호수 (Swan Lake)</option>
                    <option value="bumblebee">림스키코르사코프 - 왕벌의 비행 (Flight of the Bumblebee)</option>
                    <option value="virus">⚡ 베토벤 바이러스 (Beethoven Virus)</option>
                </select>
            </div>

            <!-- 5단계 난이도 선택 버튼 리스트 -->
            <div class="w-full max-w-sm space-y-2.5">
                <p class="text-xs text-center text-gray-400 mb-1">난이도를 선택하면 즉시 연주가 시작됩니다</p>
                
                <!-- 하 (Easy) -->
                <button onclick="startGame('easy')" class="btn-classic w-full py-3 px-4 rounded-xl bg-gradient-to-r from-emerald-900/80 to-emerald-700/80 border border-emerald-400/40 flex justify-between items-center text-left">
                    <div>
                        <span class="font-bold text-emerald-300 text-base">하 (EASY)</span>
                        <p class="text-[11px] text-emerald-100/70">여유로운 템포, 입문자용 클래식 감상</p>
                    </div>
                    <span class="text-xs font-classic bg-emerald-950/80 px-2.5 py-1 rounded-full text-emerald-300">Lv. 1</span>
                </button>

                <!-- 중 (Normal) -->
                <button onclick="startGame('normal')" class="btn-classic w-full py-3 px-4 rounded-xl bg-gradient-to-r from-sky-900/80 to-sky-700/80 border border-sky-400/40 flex justify-between items-center text-left">
                    <div>
                        <span class="font-bold text-sky-300 text-base">중 (NORMAL)</span>
                        <p class="text-[11px] text-sky-100/70">경쾌한 리듬감, 표준 연주 속도</p>
                    </div>
                    <span class="text-xs font-classic bg-sky-950/80 px-2.5 py-1 rounded-full text-sky-300">Lv. 4</span>
                </button>

                <!-- 상 (Hard) -->
                <button onclick="startGame('hard')" class="btn-classic w-full py-3 px-4 rounded-xl bg-gradient-to-r from-amber-900/80 to-amber-700/80 border border-amber-400/50 flex justify-between items-center text-left">
                    <div>
                        <span class="font-bold text-amber-300 text-base">상 (HARD)</span>
                        <p class="text-[11px] text-amber-100/70">화려한 속주와 동시타 패턴 등장</p>
                    </div>
                    <span class="text-xs font-classic bg-amber-950/80 px-2.5 py-1 rounded-full text-amber-300">Lv. 7</span>
                </button>

                <!-- 최상 (Extreme) -->
                <button onclick="startGame('extreme')" class="btn-classic w-full py-3 px-4 rounded-xl bg-gradient-to-r from-purple-900/90 to-fuchsia-800/90 border border-fuchsia-400/60 flex justify-between items-center text-left">
                    <div>
                        <span class="font-bold text-fuchsia-300 text-base">최상 (EXTREME)</span>
                        <p class="text-[11px] text-fuchsia-100/80">비르투오소(거장)의 영역, 폭풍 같은 건반</p>
                    </div>
                    <span class="text-xs font-classic bg-purple-950/90 px-2.5 py-1 rounded-full text-fuchsia-300">Lv. 10</span>
                </button>

                <!-- 절대 못 깨는 난이도 (IMPOSSIBLE) -->
                <button onclick="startGame('impossible')" class="btn-classic impossible-glow w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-red-950 via-red-900 to-black border-2 border-red-500 flex justify-between items-center text-left">
                    <div>
                        <span class="font-black text-red-400 text-base tracking-wide">💀 절대 못 깨는 난이도</span>
                        <p class="text-[11px] text-red-200/80">인간의 한계를 초월한 초고속 탄막 지옥 (단 1번의 Miss로 즉사 가능)</p>
                    </div>
                    <span class="text-xs font-black bg-red-600 text-white px-2.5 py-1 rounded-full animate-bounce">Lv. ???</span>
                </button>
            </div>
        </div>

        <!-- 2. 상단 HUD (게임 플레이 중 표시) -->
        <div id="hud" class="hidden absolute top-0 left-0 right-0 z-20 p-4 flex justify-between items-start pointer-events-none">
            <div>
                <div class="flex items-center gap-2">
                    <span id="hud-diff-badge" class="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-400/30">NORMAL</span>
                    <span id="hud-song-title" class="text-xs text-gray-300 font-medium truncate max-w-[140px]">터키 행진곡</span>
                </div>
                <div class="text-2xl font-black text-white tracking-wider mt-0.5 font-classic" id="score-display">000000</div>
            </div>

            <div class="flex flex-col items-end">
                <!-- 중단 버튼만 클릭 가능하도록 pointer-events-auto 설정 -->
                <button onclick="quitGame()" class="pointer-events-auto text-xs bg-white/10 hover:bg-white/20 text-gray-200 px-3 py-1 rounded-lg border border-white/10 mb-2 transition">
                    나가기
                </button>
                <!-- 체력 게이지 -->
                <div class="w-28 h-2.5 bg-gray-800 rounded-full overflow-hidden border border-white/20">
                    <div id="hp-bar" class="h-full bg-gradient-to-r from-amber-500 to-emerald-400 transition-all duration-150" style="width: 100%;"></div>
                </div>
                <span id="hp-text" class="text-[10px] text-gray-400 mt-0.5">HP 100%</span>
            </div>
        </div>

        <!-- 3. 게임 캔버스 영역 -->
        <canvas id="game-canvas"></canvas>

        <!-- 4. 모바일/마우스 터치 입력 패드 (하단 4레인 버튼) -->
        <div id="touch-controls" class="hidden absolute bottom-0 left-0 right-0 h-28 z-20 grid grid-cols-4 gap-1 p-1.5 bg-gradient-to-t from-black/90 to-transparent">
            <button data-lane="0" class="lane-btn rounded-xl bg-white/5 border border-amber-400/30 active:bg-amber-400/40 flex flex-col items-center justify-end pb-3 transition">
                <span class="text-amber-300/70 font-bold text-lg">D</span>
            </button>
            <button data-lane="1" class="lane-btn rounded-xl bg-white/5 border border-amber-400/30 active:bg-amber-400/40 flex flex-col items-center justify-end pb-3 transition">
                <span class="text-amber-300/70 font-bold text-lg">F</span>
            </button>
            <button data-lane="2" class="lane-btn rounded-xl bg-white/5 border border-amber-400/30 active:bg-amber-400/40 flex flex-col items-center justify-end pb-3 transition">
                <span class="text-amber-300/70 font-bold text-lg">J</span>
            </button>
            <button data-lane="3" class="lane-btn rounded-xl bg-white/5 border border-amber-400/30 active:bg-amber-400/40 flex flex-col items-center justify-end pb-3 transition">
                <span class="text-amber-300/70 font-bold text-lg">K</span>
            </button>
        </div>

        <!-- 5. 결과 화면 (클리어 또는 게임 오버) -->
        <div id="result-screen" class="hidden absolute inset-0 z-30 flex flex-col items-center justify-center p-6 bg-black/90 backdrop-blur-md">
            <p id="result-subtitle" class="text-xs tracking-widest uppercase mb-1 text-amber-400">Performance Complete</p>
            <h2 id="result-title" class="text-3xl font-black mb-4 text-white">연주 완료!</h2>
            
            <div class="w-full max-w-xs bg-white/5 rounded-2xl p-5 gold-border mb-6 space-y-3">
                <div class="flex justify-between items-center border-b border-white/10 pb-2">
                    <span class="text-gray-400 text-sm">최종 점수</span>
                    <span id="res-score" class="text-2xl font-black text-amber-300 font-classic">0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-gray-400">최대 콤보</span>
                    <span id="res-combo" class="font-bold text-white">0</span>
                </div>
                <div class="grid grid-cols-3 gap-2 pt-2 text-center text-xs">
                    <div class="bg-emerald-950/60 p-2 rounded-lg border border-emerald-500/30">
                        <div class="text-emerald-400 font-bold">PERFECT</div>
                        <div id="res-perfect" class="text-base font-black text-white mt-0.5">0</div>
                    </div>
                    <div class="bg-sky-950/60 p-2 rounded-lg border border-sky-500/30">
                        <div class="text-sky-400 font-bold">GOOD</div>
                        <div id="res-good" class="text-base font-black text-white mt-0.5">0</div>
                    </div>
                    <div class="bg-red-950/60 p-2 rounded-lg border border-red-500/30">
                        <div class="text-red-400 font-bold">MISS</div>
                        <div id="res-miss" class="text-base font-black text-white mt-0.5">0</div>
                    </div>
                </div>
            </div>

            <div class="flex gap-3 w-full max-w-xs">
                <button onclick="retryGame()" class="btn-classic flex-1 py-3 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-sm">
                    다시 도전
                </button>
                <button onclick="quitGame()" class="btn-classic flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 text-gray-200 font-bold text-sm">
                    난이도 선택
                </button>
            </div>
        </div>

    </div>

    <script>
        /**
         * ============================================================================
         * 클래식 리듬 마스터 (Classic Rhythm Master) - 핵심 게임 엔진
         * ============================================================================
         */

        // DOM 요소 참조
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const menuScreen = document.getElementById('menu-screen');
        const resultScreen = document.getElementById('result-screen');
        const hud = document.getElementById('hud');
        const touchControls = document.getElementById('touch-controls');

        // 오디오 신디사이저 설정 (Tone.js)
        let synth = null;
        let isAudioInitialized = false;

        async function initAudio() {
            if (!isAudioInitialized) {
                await Tone.start();
                // 우아한 그랜드 피아노 느낌의 폴리포닉 신디사이저 생성
                synth = new Tone.PolySynth(Tone.Synth, {
                    oscillator: { type: "triangle" },
                    envelope: {
                        attack: 0.01,
                        decay: 0.3,
                        sustain: 0.2,
                        release: 0.8
                    },
                    volume: -6
                }).toDestination();
                
                // 리버브(잔향) 추가로 클래식 콘서트홀 분위기 연출
                const reverb = new Tone.Reverb({ decay: 1.5, wet: 0.25 }).toDestination();
                synth.connect(reverb);
                isAudioInitialized = true;
            }
        }

        // 클래식 명곡 악보 데이터 (음계 및 박자 시퀀스)
        const CLASSICAL_SONGS = {
            summer: {
                title: "☀️ 히사이시 조 - Summer",
                bpm: 130,
                useExactTiming: true, // 원곡의 정확한 리듬과 박자(8분/16분/점음표)를 그대로 반영
                melody: [
                    // [음계, 박자배수(1.0 = 8분음표 기준)]
                    // 인트로: 경쾌한 스타카토 리듬 (A4 - D5 - E5 - F#5 ...)
                    ["A4", 1], ["D5", 1], ["E5", 1], ["F#5", 1], ["D5", 1.5], ["A4", 0.5], ["A4", 2],
                    ["A4", 1], ["D5", 1], ["E5", 1], ["F#5", 1], ["E5", 1.5], ["D5", 0.5], ["E5", 2],
                    ["A4", 1], ["D5", 1], ["E5", 1], ["F#5", 1], ["D5", 1.5], ["A4", 0.5], ["A4", 1], ["B4", 1],
                    ["C#5", 1], ["D5", 1], ["E5", 1], ["F#5", 1], ["D5", 3], [null, 1],

                    // 메인 테마 A (원곡의 대표 멜로디 & 당김음 리듬)
                    ["F#5", 0.5], ["E5", 0.5], ["D5", 1], ["D5", 1], ["B4", 1], ["D5", 1.5], ["A4", 0.5], ["A4", 2],
                    ["F#5", 0.5], ["E5", 0.5], ["D5", 1], ["D5", 1], ["B4", 1], ["E5", 1.5], ["D5", 0.5], ["E5", 2],
                    ["F#5", 0.5], ["E5", 0.5], ["D5", 1], ["D5", 1], ["B4", 1], ["D5", 1.5], ["A4", 0.5], ["A4", 1], ["B4", 1],
                    ["C#5", 1], ["D5", 1], ["E5", 1], ["F#5", 1], ["D5", 3], [null, 1],

                    // 브릿지 & 클라이맥스 전개 (높은 음역대 도약)
                    ["F#5", 1], ["G5", 1], ["A5", 1.5], ["A5", 0.5], ["A5", 1], ["B5", 1], ["A5", 1], ["F#5", 1],
                    ["D5", 1.5], ["E5", 0.5], ["F#5", 1], ["G5", 1], ["E5", 3], [null, 1],
                    ["F#5", 1], ["G5", 1], ["A5", 1.5], ["A5", 0.5], ["A5", 1], ["B5", 1], ["A5", 1], ["F#5", 1],
                    ["D5", 1], ["E5", 1], ["F#5", 1], ["E5", 1], ["D5", 3], [null, 1]
                ]
            },
            turkish: {
                title: "모차르트 - 터키 행진곡",
                bpm: 132,
                melody: [
                    "B4", "A4", "G#4", "A4", "C5", null, "D5", "C5", "B4", "C5", "E5", null,
                    "F5", "E5", "D#5", "E5", "B5", "A5", "G#5", "A5", "B5", "A5", "G#5", "A5", "C6", null,
                    "A5", "C6", "G5", "A5", "B5", "A5", "G5", "A5", "B5", "A5", "G5", "F#5", "E5", null,
                    "E5", "F5", "G5", "G5", "A5", "G5", "F5", "E5", "D5", null,
                    "E5", "F5", "G5", "G5", "A5", "G5", "F5", "E5", "D5", null,
                    "C5", "D5", "E5", "E5", "F5", "E5", "D5", "C5", "B4", null,
                    "B4", "A4", "G#4", "A4", "C5", "A4", "B4", "G#4", "A4", null
                ]
            },
            beethoven: {
                title: "베토벤 - 엘리제를 위하여",
                bpm: 120,
                melody: [
                    "E5", "D#5", "E5", "D#5", "E5", "B4", "D5", "C5", "A4", null,
                    "C4", "E4", "A4", "B4", null, "E4", "G#4", "B4", "C5", null,
                    "E4", "E5", "D#5", "E5", "D#5", "E5", "B4", "D5", "C5", "A4", null,
                    "C4", "E4", "A4", "B4", null, "E4", "C5", "B4", "A4", null,
                    "B4", "C5", "D5", "E5", null, "G4", "F5", "E5", "D5", null,
                    "F4", "E5", "D5", "C5", null, "E4", "D5", "C5", "B4", null,
                    "E5", "D#5", "E5", "D#5", "E5", "B4", "D5", "C5", "A4", null
                ]
            },
            canon: {
                title: "파헬벨 - 캐논 변주곡",
                bpm: 108,
                melody: [
                    "F#5", null, "E5", null, "D5", null, "C#5", null,
                    "B4", null, "A4", null, "B4", null, "C#5", null,
                    "D5", "F#5", "A5", "G5", "F#5", "D5", "F#5", "E5",
                    "D5", "B4", "D5", "A5", "G5", "B5", "A5", "G5",
                    "F#5", "D5", "E5", "C#5", "D5", "F#5", "A5", "A4",
                    "B4", "G5", "F#5", "E5", "F#5", "D5", "D6", "C#6",
                    "B5", "D6", "C#6", "B5", "A5", "G5", "F#5", "E5", "D5", null
                ]
            },
            spring: {
                title: "비발디 - 사계 '봄'",
                bpm: 128,
                melody: [
                    "E5", "G#5", "G#5", "G#5", "F#5", "E5", "B5", null,

        // 키보드 매핑 (D, F, J, K)

        // 캔버스 크기 반응형 조정
        function resizeCanvas() {

        /**
         * 선택된 곡과 난이도에 맞춰 전체 노트(채보)를 생성하는 함수
         */
        function generateChart(songKey, diffKey) {
            const song = CLASSICAL_SONGS[songKey];
            const config = DIFFICULTY_CONFIG[diffKey];
            const notes = [];
            let currentTime = 1.6; // 시작 전 1.6초 대기 시간
            let lastLane = -1;

            // 난이도에 따라 멜로디 반복 횟수 확장 (상/최상/절대못깨는 난이도는 2회 반복)
            const repeatCount = (diffKey === 'hard' || diffKey === 'extreme' || diffKey === 'impossible') ? 2 : 1;
            let fullMelody = [];
            for (let r = 0; r < repeatCount; r++) {
                fullMelody = fullMelody.concat(song.melody);
            }

            fullMelody.forEach((item, index) => {
                // 정밀 박자 배열([음계, 박자배수])과 일반 문자열 음계 모두 호환 처리
                const pitch = Array.isArray(item) ? item[0] : item;
                const beatMultiplier = Array.isArray(item) ? item[1] : 1.0;
                const stepDuration = song.useExactTiming
                    ? (60 / song.bpm / 2) * beatMultiplier // BPM 기반 정확한 8분음표/16분음표 박자 간격
                    : config.noteInterval * beatMultiplier;

                // 쉼표(null) 처리
                if (!pitch) {
                    currentTime += song.useExactTiming ? stepDuration : stepDuration * 0.8;
                    return;
                }

                // 난이도 밀도에 따라 일부 노트 생략 (단, 원곡 리듬 유지 곡은 하 난이도에서만 일부 생략)
                if (Math.random() > config.density && index % 2 !== 0 && (!song.useExactTiming || diffKey === 'easy')) {
                    currentTime += stepDuration;
                    return;
                }

                // 레인 배정 (연속 같은 레인 방지 로직 포함, 단 impossible은 무자비하게 배정)
                let lane = Math.floor(Math.random() * 4);
                if (diffKey !== 'impossible' && lane === lastLane) {
                    lane = (lane + 1 + Math.floor(Math.random() * 2)) % 4;
                }
                lastLane = lane;

                notes.push({
                    time: currentTime,
                    lane: lane,
                    pitch: pitch,
                    hit: false,
                    missed: false
                });

                // 동시타(화음) 노트 추가 생성
                if (Math.random() < config.chordChance) {
                    let secondLane = (lane + 1 + Math.floor(Math.random() * 3)) % 4;
                    notes.push({
                        time: currentTime,
                        lane: secondLane,
                        pitch: pitch, // 화음 사운드 효과
                        hit: false,
                        missed: false
                    });

                    // '절대 못 깨는 난이도' 전용: 3동시타 및 4동시타(벽) 패턴 추가
                    if (diffKey === 'impossible' && Math.random() < 0.55) {
                        let thirdLane = (secondLane + 1) % 4;
                        if (thirdLane !== lane) {
                            notes.push({
                                time: currentTime,
                                lane: thirdLane,
                                pitch: pitch,
                                hit: false,
                                missed: false
                            });
                        }
                        // 20% 확률로 4개 키 동시 입력(전 레인 봉쇄)
                        if (Math.random() < 0.25) {
                            for (let l = 0; l < 4; l++) {
                                if (l !== lane && l !== secondLane && l !== thirdLane) {
                                    notes.push({
                                        time: currentTime,
                                        lane: l,
                                        pitch: pitch,
                                        hit: false,
                                        missed: false
                                    });
                                }
                            }
                        }
                    }
                }

                currentTime += stepDuration;
            });

            gameState.songDuration = currentTime + 2.0;
            return notes;
        }

        /**
         * 게임 시작 함수
         */
        async function startGame(difficulty) {
            try {
                await initAudio();
            } catch (e) {
                console.warn("오디오 초기화 대기 중:", e);

            const songKey = document.getElementById('song-select').value;

            const song = CLASSICAL_SONGS[songKey];

            // 상태 초기화
            gameState.isPlaying = true;

            gameState.difficulty = difficulty;
            gameState.score = 0;
            gameState.combo = 0;
            gameState.maxCombo = 0;
            gameState.hp = 100;
            gameState.perfect = 0;
            gameState.good = 0;
            gameState.miss = 0;
            gameState.effects = [];
            gameState.notes = generateChart(songKey, difficulty);
            gameState.startTime = performance.now() / 1000;
            gameState.lastFrameTime = gameState.startTime;

            // UI 전환
            menuScreen.classList.add('hidden');
            resultScreen.classList.add('hidden');
            hud.classList.remove('hidden');

        /**
         * HUD 점수 및 체력 게이지 갱신
         */
        function updateHUD() {
            document.getElementById('score-display').textContent = String(gameState.score).padStart(6, '0');
            const hpBar = document.getElementById('hp-bar');
            const hpText = document.getElementById('hp-text');
            const clampedHp = Math.max(0, Math.min(100, gameState.hp));
            
            hpBar.style.width = `${clampedHp}%`;
            hpText.textContent = `HP ${Math.round(clampedHp)}%`;

            if (clampedHp > 50) {
                hpBar.className = "h-full bg-gradient-to-r from-amber-400 to-emerald-400 transition-all duration-150";
            } else if (clampedHp > 25) {
                hpBar.className = "h-full bg-gradient-to-r from-orange-500 to-amber-400 transition-all duration-150";
            } else {
                hpBar.className = "h-full bg-red-600 animate-pulse transition-all duration-150";
            }
        }

        /**
         * 레인 입력 처리 (키보드 및 터치 공용)
         */
        function triggerLaneInput(lane) {
            if (!gameState.isPlaying) return;

            gameState.lanePressed[lane] = true;
            const currentTime = (performance.now() / 1000) - gameState.startTime;

            // 해당 레인에서 아직 처리되지 않은 가장 가까운 노트 탐색
            let targetNote = null;
            let minDiff = Infinity;

            for (let i = 0; i < gameState.notes.length; i++) {
                const note = gameState.notes[i];
                if (!note.hit && !note.missed && note.lane === lane) {
                    const diff = Math.abs(note.time - currentTime);
                    if (diff < minDiff) {
                        minDiff = diff;
                        targetNote = note;
                    }
                }
            }

            // 판정 윈도우 안에 노트가 있는 경우
            if (targetNote && minDiff <= HIT_WINDOW.MISS) {
                targetNote.hit = true;
                playNoteSound(targetNote.pitch);

                if (minDiff <= HIT_WINDOW.PERFECT) {
                    handleHit('PERFECT', lane, 1000);
                } else if (minDiff <= HIT_WINDOW.GOOD) {
                    handleHit('GOOD', lane, 500);
                } else {
                    // 너무 일찍 누른 경우 Miss 처리
                    handleMiss(lane);
                }
            } else {
                // 빈 허공 입력 시 가벼운 타건음 재생
                playNoteSound("C3", true);
            }
        }

        function releaseLaneInput(lane) {
            gameState.lanePressed[lane] = false;
        }

        /**
         * 피아노 건반 사운드 재생
         */
        function playNoteSound(pitch, isGhost = false) {
            if (!synth || !isAudioInitialized) return;
            try {
                if (isGhost) {
                    synth.triggerAttackRelease(pitch, "32n", undefined, 0.15);
                } else {
                    synth.triggerAttackRelease(pitch, "8n", undefined, 0.85);
                }
            } catch (e) {
                // 동시 다발적 사운드 충돌 무시
            }
        }

        /**
         * 판정 성공 처리
         */
        function handleHit(judgment, lane, baseScore) {
            gameState.combo++;
            if (gameState.combo > gameState.maxCombo) {
                gameState.maxCombo = gameState.combo;
            }

            const comboBonus = Math.floor(gameState.combo * 15);
            gameState.score += baseScore + comboBonus;

            if (judgment === 'PERFECT') {
                gameState.perfect++;
                gameState.hp = Math.min(100, gameState.hp + 1.5);
            } else {
                gameState.good++;
                gameState.hp = Math.min(100, gameState.hp + 0.5);
            }

            addEffect(lane, judgment);
            updateHUD();
        }

        /**
         * Miss 처리 및 체력 감소
         */
        function handleMiss(lane) {
            const config = DIFFICULTY_CONFIG[gameState.difficulty];
            gameState.combo = 0;
            gameState.miss++;
            gameState.hp -= config.hpDrain;
            gameState.shakeTime = 0.15; // 화면 진동

            addEffect(lane, 'MISS');
            updateHUD();

            if (gameState.hp <= 0) {
                endGame(false);
            }
        }

        /**
         * 시각 이펙트 추가
         */
        function addEffect(lane, text) {
            gameState.effects.push({
                lane: lane,
                text: text,
                alpha: 1.0,
                yOffset: 0,
                scale: 1.3
            });
        }

        /**
         * 게임 종료 및 결과 화면 표시
         */
        function endGame(isClear) {
            gameState.isPlaying = false;
            cancelAnimationFrame(gameState.animationFrameId);

            hud.classList.add('hidden');
            touchControls.classList.add('hidden');
            resultScreen.classList.remove('hidden');

            const titleEl = document.getElementById('result-title');
            const subEl = document.getElementById('result-subtitle');

            if (isClear) {
                if (gameState.difficulty === 'impossible') {
                    subEl.textContent = "UNBELIEVABLE MIRACLE";
                    subEl.className = "text-xs tracking-widest uppercase mb-1 text-red-400 font-bold";
                    titleEl.textContent = "👑 박민재님, 신의 경지에 도달했습니다!";
                    titleEl.className = "text-2xl sm:text-3xl font-black mb-4 gold-text text-center";
                } else {
                    subEl.textContent = "SYMPHONY COMPLETED";
                    subEl.className = "text-xs tracking-widest uppercase mb-1 text-amber-400";
                    titleEl.textContent = "✨ 박민재님, 연주 성공!";
                    titleEl.className = "text-2xl sm:text-3xl font-black mb-4 gold-text text-center";
                }
            } else {
                subEl.textContent = "PERFORMANCE FAILED";
                subEl.className = "text-xs tracking-widest uppercase mb-1 text-red-500";
                titleEl.textContent = gameState.difficulty === 'impossible' ? "💀 역시 불가능했습니다..." : "연주 중단 (Game Over)";
                titleEl.className = "text-2xl sm:text-3xl font-black mb-4 text-red-400 text-center";
            }

            document.getElementById('res-score').textContent = gameState.score.toLocaleString();
            document.getElementById('res-combo').textContent = `${gameState.maxCombo} COMBO`;
            document.getElementById('res-perfect').textContent = gameState.perfect;
            document.getElementById('res-good').textContent = gameState.good;
            document.getElementById('res-miss').textContent = gameState.miss;
        }

        /**
         * ============================================================================
         * 메인 렌더링 및 업데이트 루프 (60FPS+)
         * ============================================================================
         */
        function gameLoop() {
            if (!gameState.isPlaying) return;

            const now = performance.now() / 1000;
            const dt = now - gameState.lastFrameTime;
            gameState.lastFrameTime = now;

            const currentTime = now - gameState.startTime;
            const config = DIFFICULTY_CONFIG[gameState.difficulty];

            // 화면 크기 및 판정선 Y 좌표 계산
            const width = canvas.width;
            const height = canvas.height;
            const laneWidth = width / 4;
            const hitLineY = height - 135; // 하단 터치 패드 바로 위 판정선

            // 1. 배경 클리어 및 화면 진동 적용
            ctx.save();
            if (gameState.shakeTime > 0) {
                gameState.shakeTime -= dt;
                const dx = (Math.random() - 0.5) * 10;
                const dy = (Math.random() - 0.5) * 10;
                ctx.translate(dx, dy);
            }

            ctx.clearRect(0, 0, width, height);

            // '절대 못 깨는 난이도' 전용 붉은 배경 펄스 효과
            if (gameState.difficulty === 'impossible') {
                const pulse = Math.sin(currentTime * 12) * 0.08 + 0.12;
                ctx.fillStyle = `rgba(220, 38, 38, ${pulse})`;
                ctx.fillRect(0, 0, width, height);
            }

            // 2. 4개 레인 구분선 및 키 입력 하이라이트 그리기
            for (let i = 0; i < 4; i++) {
                const x = i * laneWidth;

                // 키 눌림 시 황금빛/붉은빛 빛기둥 이펙트
                if (gameState.lanePressed[i]) {
                    const grad = ctx.createLinearGradient(0, hitLineY - 250, 0, hitLineY);
                    if (gameState.difficulty === 'impossible') {
                        grad.addColorStop(0, 'rgba(239, 68, 68, 0)');
                        grad.addColorStop(1, 'rgba(239, 68, 68, 0.35)');
                    } else {
                        grad.addColorStop(0, 'rgba(251, 191, 36, 0)');
                        grad.addColorStop(1, 'rgba(251, 191, 36, 0.3)');
                    }
                    ctx.fillStyle = grad;
                    ctx.fillRect(x, hitLineY - 250, laneWidth, 250);
                }

                // 레인 수직 경계선
                ctx.strokeStyle = 'rgba(212, 175, 55, 0.15)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // 3. 판정선(Hit Line) 그리기
            ctx.strokeStyle = gameState.difficulty === 'impossible' ? '#ef4444' : '#fbbf24';
            ctx.lineWidth = 3;
            ctx.shadowBlur = 15;
            ctx.shadowColor = gameState.difficulty === 'impossible' ? '#dc2626' : '#f59e0b';
            ctx.beginPath();
            ctx.moveTo(0, hitLineY);
            ctx.lineTo(width, hitLineY);
            ctx.stroke();
            ctx.shadowBlur = 0;

            // 4. 중앙 콤보(COMBO) 배경 워터마크 표시
            if (gameState.combo >= 2) {
                ctx.save();
                ctx.textAlign = 'center';
                ctx.fillStyle = gameState.difficulty === 'impossible' 
                    ? 'rgba(248, 113, 113, 0.25)' 
                    : 'rgba(253, 230, 138, 0.22)';
                ctx.font = '900 64px Cinzel, serif';
                ctx.fillText(gameState.combo, width / 2, height * 0.42);
                ctx.font = '700 14px "Noto Sans KR", sans-serif';
                ctx.fillText('COMBO', width / 2, height * 0.42 + 24);
                ctx.restore();
            }

            // 캔버스 하단(판정선 위) 은은한 '박민재' 시그니처 워터마크
            ctx.save();
            ctx.textAlign = 'center';
            ctx.fillStyle = 'rgba(253, 230, 138, 0.12)';
            ctx.font = '700 13px "Noto Sans KR", sans-serif';
            ctx.fillText('★ 박민재 EDITION ★', width / 2, hitLineY - 12);
            ctx.restore();

            // 5. 떨어지는 노트(타일) 업데이트 및 렌더링
            const noteHeight = 24;
            for (let i = 0; i < gameState.notes.length; i++) {
                const note = gameState.notes[i];
                if (note.hit || note.missed) continue;

                // 판정선을 지나쳐 Miss 처리되는 경우
                if (currentTime - note.time > HIT_WINDOW.MISS) {
                    note.missed = true;
                    handleMiss(note.lane);
                    if (!gameState.isPlaying) {
                        ctx.restore();
                        return;
                    }
                    continue;
                }

                // 노트의 현재 Y 좌표 계산
                const timeDiff = note.time - currentTime;
                const y = hitLineY - (timeDiff * config.speed);

                // 화면 위쪽에 아직 안 보이면 스킵
                if (y < -noteHeight || y > height) continue;

                const x = note.lane * laneWidth + 6;
                const w = laneWidth - 12;

                // 클래식 피아노 건반/금괴 스타일 노트 디자인
                const noteGrad = ctx.createLinearGradient(x, y - noteHeight / 2, x, y + noteHeight / 2);
                if (gameState.difficulty === 'impossible') {
                    noteGrad.addColorStop(0, '#fca5a5');
                    noteGrad.addColorStop(0.5, '#ef4444');
                    noteGrad.addColorStop(1, '#991b1b');
                } else if (note.lane === 1 || note.lane === 2) {
                    // 중앙 2개 레인은 황금색 포인트
                    noteGrad.addColorStop(0, '#fef08a');
                    noteGrad.addColorStop(0.5, '#f59e0b');
                    noteGrad.addColorStop(1, '#b45309');
                } else {
                    // 외곽 2개 레인은 상아색(피아노 백건) 포인트
                    noteGrad.addColorStop(0, '#ffffff');
                    noteGrad.addColorStop(0.5, '#e2e8f0');
                    noteGrad.addColorStop(1, '#94a3b8');
                }

                ctx.fillStyle = noteGrad;
                ctx.beginPath();
                ctx.roundRect(x, y - noteHeight / 2, w, noteHeight, 6);
                ctx.fill();

                // 노트 테두리 하이라이트
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                ctx.lineWidth = 1.5;
                ctx.stroke();
            }

            // 6. 타격 판정 이펙트(PERFECT / GOOD / MISS) 렌더링
            for (let i = gameState.effects.length - 1; i >= 0; i--) {
                const eff = gameState.effects[i];
                eff.alpha -= dt * 2.2;
                eff.yOffset -= dt * 55;
                eff.scale = Math.max(1.0, eff.scale - dt * 1.5);

                if (eff.alpha <= 0) {
                    gameState.effects.splice(i, 1);
                    continue;
                }

                const centerX = eff.lane * laneWidth + laneWidth / 2;
                const centerY = hitLineY - 30 + eff.yOffset;

                ctx.save();
                ctx.globalAlpha = eff.alpha;
                ctx.translate(centerX, centerY);
                ctx.scale(eff.scale, eff.scale);
                ctx.textAlign = 'center';
                ctx.font = '900 15px "Noto Sans KR", sans-serif';

                if (eff.text === 'PERFECT') {
                    ctx.fillStyle = '#fde047';
                    // 타격 빛무리 원형 이펙트
                    ctx.beginPath();
                    ctx.arc(0, 30 - eff.yOffset, 28 * (1.2 - eff.alpha), 0, Math.PI * 2);
                    ctx.strokeStyle = `rgba(253, 224, 71, ${eff.alpha * 0.7})`;
                    ctx.lineWidth = 3;
                    ctx.stroke();
                } else if (eff.text === 'GOOD') {
                    ctx.fillStyle = '#38bdf8';
                } else {
                    ctx.fillStyle = '#f87171';
                }

                ctx.fillText(eff.text, 0, 0);
                ctx.restore();
            }

            ctx.restore();

            // 7. 곡 종료 체크
            if (currentTime >= gameState.songDuration) {
                endGame(true);
                return;
            }

            gameState.animationFrameId = requestAnimationFrame(gameLoop);
        }

        /**
         * ============================================================================
         * 이벤트 리스너 (키보드 및 터치/마우스 멀티터치 지원)
         * ============================================================================
         */
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            if (e.code in KEY_MAP) {
                const lane = KEY_MAP[e.code];
                triggerLaneInput(lane);
                // 하단 버튼 시각적 활성화
                const btn = document.querySelector(`.lane-btn[data-lane="${lane}"]`);
                if (btn) btn.classList.add('bg-amber-400/40');
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.code in KEY_MAP) {
                const lane = KEY_MAP[e.code];
                releaseLaneInput(lane);
                const btn = document.querySelector(`.lane-btn[data-lane="${lane}"]`);
                if (btn) btn.classList.remove('bg-amber-400/40');
            }
        });

        // 모바일 멀티터치 및 마우스 클릭 바인딩
        document.querySelectorAll('.lane-btn').forEach(btn => {
            const lane = parseInt(btn.getAttribute('data-lane'), 10);

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                triggerLaneInput(lane);
                btn.classList.add('bg-amber-400/40');
            }, { passive: false });

            btn.addEventListener('touchend', (e) => {
                e.preventDefault();
                releaseLaneInput(lane);
                btn.classList.remove('bg-amber-400/40');
            });

            btn.addEventListener('mousedown', () => {
                triggerLaneInput(lane);
            });

            btn.addEventListener('mouseup', () => {
                releaseLaneInput(lane);
            });

            btn.addEventListener('mouseleave', () => {
                releaseLaneInput(lane);
            });
        });
    </script>
</body>
</html>
